<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Atividade Avaliativa DW2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ----------------------------------------------------------- -->
  <h2>Exercício 1</h2>
  <label for="precoCombustivel">Preço do Combustível (R$):</label>
  <input type="number" step="0.01" id="precoCombustivel" min="0" placeholder="Ex: 6,53">

  <hr>

  <h2>Cadastrar Pedido</h2>
  <form id="formPedido">
    <label>Código do Pedido:</label>
    <input type="text" id="codigo" required placeholder="Ex: PED-1"><br><br>

    <label>Região:</label>
    <select id="regiao">
      <option value="1">1 - Sudeste</option>
      <option value="2">2 - Sul</option>
      <option value="3">3 - Centro-Oeste</option>
    </select><br><br>

    <label>Distância (km):</label>
    <input type="number" id="distancia" required placeholder="Ex: 20"><br><br>

    <label for="qtdPecas">Quantidade de Peças:</label>
    <input type="number" id="qtdPecas" required placeholder="Ex: 1200"><br><br>

    <label>
      <input type="checkbox" id="temRastreamento"> Deseja rastreamento? 
    </label><br><br>

    <button type="button" onclick="adicionarPedido()">Adicionar Pedido</button>
    <button type="button" onclick="gerarRelatorio()">Gerar Relatório de Pedidos</button>
  </form>

  <hr>

  <h2>Relatório de Pedidos</h2>
  <div id="resultadoFrete"></div>
  <hr>

  <!-- ----------------------------------------------------------- -->

  <h2>Exercício 2</h2>
    <label for="salarioMinimo">Valor do Salário Mínimo (R$):</label>
  <input type="number" step="0.01" id="salarioMinimo" min="0" placeholder="Ex: 1412.00">

  <h2>Cadastrar Funcionário</h2>
  <form id="formFormulario">
    <label for="codigoFuncionario">Código do Funcionário:</label>
    <input type="text" id="codigoFuncionario" required placeholder="Ex: 101"><br><br>

    <label for="horasTrabalhadas">Horas Trabalhadas no Mês:</label>
    <input type="number" id="horasTrabalhadas" min="0" required placeholder="Ex: 220"><br><br>

    <label for="categoriaFuncionario">Categoria:</label>
    <select id="categoriaFuncionario">
      <option value="F">F - Funcionário Operacional</option>
      <option value="G">G - Gerente</option>
    </select><br><br>

    <label for="turnoTrabalho">Turno de Trabalho:</label>
    <select id="turnoTrabalho">
      <option value="M">M - Matutino</option>
      <option value="V">V - Vespertino</option>
      <option value="N">N - Noturno</option>
    </select><br><br>

    <label for="avaliacaoGeral">Avaliação de Desempenho (0 a 10):</label>
    <input type="number" step="0.01" id="avaliacaoGeral" min="0" max="10" required placeholder="Ex: 9,3"><br><br>

    <button type="button" onclick="cadastrarFuncionario()">Cadastrar Funcionário</button>
    <button type="button" onclick="gerarRelatoriofuncionario()">Gerar Relatório de Funcionários</button>
  </form>

  <hr>

  <h2>Relatório de Funcionários</h2>
  <div id="resultadoFuncionario"></div>
  <hr>

  <!-- ----------------------------------------------------------- -->

  <h2>Exercício 3</h2>
  <h2>Cadastrar Ordem de Produção</h2>
  <form id="formOrdem">
    <label for="codigoOrdem">Código da Ordem:</label>
    <input type="number" id="codigoOrdem" required placeholder="Ex: 501"><br><br>

    <label for="codigoProduto">Código do Produto:</label>
    <input type="number" id="codigoProduto" required placeholder="Ex: 10"><br><br>

    <label for="tipoProduto">Tipo de Produto:</label>
    <select id="tipoProduto">
      <option value="1">1 - Padrão</option>
      <option value="2">2 - Premium</option>
      <option value="3">3 - Sob Encomenda</option>
    </select><br><br>

    <label for="qtdproduzida">Quantidade Produzida:</label>
    <input type="number" id="qtdproduzida" min="0" required placeholder="Ex: 1500"><br><br>

    <label for="custoUnitario">Custo Unitário (R$):</label>
    <input type="number" step="0.01" id="custoUnitario" min="0" required placeholder="Ex: 25.50"><br><br>

    <label for="estoqueInicial">Estoque Inicial:</label>
    <input type="number" id="estoqueInicial" min="0" required placeholder="Ex: 200"><br><br>

    <button type="button" onclick="cadastrarOrdem()">Cadastrar Ordem</button>
    <button type="button" onclick="gerarRelatorioOrdem()">Gerar Relatório de Estoque</button>
  </form>

  <hr>

  <h2>Relatório de Estoque</h2>
  <div id="resultadoOrdem"></div>
  <hr>

  <!-- ----------------------------------------------------------- -->
  
  <h2>Exercício 4</h2>
  <label for="valorBaseDiaria">Valor Base da Diária Padrão (R$):</label>
  <input type="number" step="0.01" id="valorBaseDiaria" min="0" placeholder="Ex: 150.00"><br><br>
  
  <label for="valorCafedaManha">Valor do Café da Manhã (por Hóspede/Dia) (R$):</label>
  <input type="number" step="0.01" id="valorCafedaManha" min="0" placeholder="Ex: 35.00">

  <h2>Cadastrar Reserva</h2>
  <form id="formReserva">
    <label for="codigoreserva">Código da Reserva:</label>
    <input type="number" id="codigoreserva" required placeholder="Ex: 1001"><br><br>

    <label for="tipoDeQuarto">Tipo de Quarto:</label>
    <select id="tipoDeQuarto">
      <option value="1">1 - Standard</option>
      <option value="2">2 - Luxo</option>
      <option value="3">3 - Premium</option>
    </select><br><br>

    <label for="temporada">Temporada:</label>
    <select id="temporada">
      <option value="1">1 - Baixa</option>
      <option value="2">2 - Alta</option>
      <option value="3">3 - Feriado</option>
    </select><br><br>

    <label for="qtdDiarias">Quantidade de Diárias:</label>
    <input type="number" id="qtdDiarias" min="1" required placeholder="Ex: 5"><br><br>

    <label for="qtdHospedes">Número de Hóspedes:</label>
    <input type="number" id="qtdHospedes" min="1" required placeholder="Ex: 2"><br><br>

    <label>
      <input type="checkbox" id="cafedaManhaInluso"> Café da manhã incluso? 
    </label><br><br>

    <button type="button" onclick="cadastrarReserva()">Cadastrar Reserva</button>
    <button type="button" onclick="gerarRelatorioReserva()">Gerar Relatório de Reservas</button>
  </form>

  <hr>

  <h2>Relatório de Reservas</h2>
  <div id="resultadoReserva"></div>
  <br><br>

  <script src="script.js"></script>
</body>
</html>
