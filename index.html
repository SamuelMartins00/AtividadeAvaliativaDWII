<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Atividade Avaliativa DW2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ----------------------------------------------------------- -->
  <h2>Exercício 1</h2>
  <label for="precoCombustivel">Preço do Combustível (R$):</label>
  <input type="number" step="0.01" id="precoCombustivel" min="0">

  <hr>

  <h2>Cadastrar Pedido</h2>
  <form id="formPedido">
    <label>Código do Pedido:</label>
    <input type="text" id="codigo" required><br><br>

    <label>Região:</label>
    <select id="regiao">
      <option value="1">1 - Sudeste</option>
      <option value="2">2 - Sul</option>
      <option value="3">3 - Centro-Oeste</option>
    </select><br><br>

    <label>Distância (km):</label>
    <input type="number" id="distancia" required><br><br>

    <label>Quantidade de Peças:</label>
    <input type="number" id="qtdPecas" required><br><br>

    <label>
      <input type="checkbox" id="temRastreamento"> Deseja rastreamento? 
    </label><br><br>

    <button type="button" onclick="adicionarPedido()">Adicionar Pedido</button>
    <button type="button" onclick="gerarRelatorio()">Gerar Relatório</button>
  </form>

  <hr>

  <h2>Relatório Final</h2>
  <div id="resultado"></div>

  <!-- ----------------------------------------------------------- -->

  <h2>Exercício 2</h2>
  

  <script src="script.js"></script>
</body>
</html>
